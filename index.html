ns de navigation','La position du pôle Nord','Le nombre de continents'],0,'Le recul de la banquise peut faciliter certaines navigations saisonnières, avec des risques persistants.'],['Quel enjeu doit aussi être pris en compte ?',['Les droits des peuples autochtones','Uniquement le tourisme','La disparition des lois'],0,'Les peuples autochtones et les écosystèmes doivent être pris en compte dans les décisions.']]}];

g="eager" alt="Quatre jeunes explorateurs avec une carte, un carnet et un appareil photo"></div><div class="welcome-strap"><strong>Le monde est connecté. À toi de comprendre comment.</strong><a class="btn yellow" href="atlas-mondial.html">🌍 Commencer l'exploration</a></div></section><section class="expedition-path" aria-label="Ton parcours d'explorateur"><span class="eyebrow">TON EXPÉDITION</span><h2>Une découverte, une enquête, une connexion</h2><p>Choisis un pays, analyse des documents, puis découvre comment il dépend des autres.</p><div class="expedition-steps"><a href="atlas-mondial.html"><span class="step-num">01</span><span><strong>Explorer un pays</strong><small>37 territoires à parcourir</small></span><span aria-hidden="true">→</span></a><a href="enquetes-pays.html"><span class="step-num">02</span><span><strong>Mener une enquête</strong><small>RDC · Indonésie · Japon</small></span><span aria-hidden="true">→</span></a><a href="couches-geopolitiques.html"><span class="step-num">03</span><span><strong>Relier les territoires</strong><small>Ressources · routes · dépendances</small></span><span aria-hidden="true">→</span></a></div></section><section class="spotlight"><div><span class="eyebrow">DÉFI DU MOMENT</span><h2>Pourquoi une batterie relie-t-elle trois continents ?</h2><p>Pars de la RDC et de son cobalt, compare avec le nickel indonésien et examine les besoins industriels du Japon. Trois enquêtes différentes pour comprendre une même chaîne mondiale.</p><a class="btn yellow" href="enquetes-pays.html">🧩 Ouvrir les trois enquêtes</a></div><div class="spotlight-icons" aria-hidden="true">🇨🇩 <span>↔</span> 🇮🇩 <span>↔</span> 🇯🇵</div></section><details class="home-more"><summary>🗂️ Voir toutes les autres activités <span aria-hidden="true">⌄</span></summary><div class="home-more-links"><a href="enquete-suez.html">🔎 Grande enquête : Suez</a><a href="atelier-suez.html">🔬 Laboratoire des preuves</a><a href="cartographie.html">🗺️ Routes maritimes</a><a href="couches-geopolitiques.html">📊 Couches chiffrées</a><button onclick="show('missions')">🎯 Missions et quiz</button><button onclick="show('dossiers')">📚 Six univers</button><button onclick="show('collection')">🃏 Collection</button></div></details>`}function tile(img,title,desc,action,label){return `<article class="tile"><img src="${A+img}" alt=""><div class="tile-body"><h3>${title}</h3><p>${desc}</p><button onclick="${action}">${label}</button></div></article>`}function openWorld(i){state.world=i;show('dossiers')}
const levels=['Je découvre · Collège','Je comprends · Lycée','Je décrypte · Approfondissement'];function levelButtons(){return `<div class="pills">${levels.map((s,i)=>`<button class="${state.level===i?'active':''}" onclick="state.level=${i};render()">${s}</button>`).join('')}</div>`}function dossiers(){let idx=state.world??0;return `<div class="heading"><h2>📚 Dossiers thématiques</h2></div>${levelButtons()}<div class="grid">${worlds.map((w,i)=>`<article class="tile"><img src="${A+w.img}" alt=""><div class="tile-body"><h3>${w.icon} ${w.name}</h3><p>${w.detail[state.level]}</p><button onclick="state.world=${i};show('atlas')">Voir l'atlas →</button></div></article>`).join('')}</div><p class="source-note">Contenus de démonstration : à enrichir de sources datées pour une publication pédagogique complète.</p>`}function missionList(){return `<div class="heading"><h2>🧭 Missions d'exploration</h2></div><p>Trois enquêtes, chacune composée de trois défis et d'une explication après chaque réponse.</p><div class="grid">${missions.map((m,i)=>tile(m.img,(state.done.includes(i)?'✅ ':'')+m.title,m.intro,`start(${i})`,'Jouer →')).join('')}</div>`}function start(i){state.mission=i;state.question=0;state.answered=false;state.choice=-1;show('quiz')}function quizView(){let m=missions[state.mission],q=m.questions[state.question],n=state.question+1;return `<div class="heading"><h2>🏆 Mission ${state.mission+1} : ${m.title}</h2></div><div class="panel"><div class="mission-head"><img src="${A+m.img}" alt=""><div><span class="eyebrow">DÉFI ${n} / ${m.questions.length}</span><h2>${m.title}</h2><p>${m.intro}</p><div class="progress"><span style="width:${(n-1)/m.questions.length*100}%"></span></div></div></div><h2 style="margin-top:25px">${q[0]}</h2><div class="choices">${q[1].map((v,i)=>`<button ${state.answered?'disabled':''} class="${state.answered?(i===q[2]?'correct':i===state.choice?'wrong':''):''}" onclick="choose(${i})">${'ABCD'[i]}. ${v}</button>`).join('')}</div>${state.answered?`<div class="feedback"><strong>${state.choice===q[2]?'✅ Bien joué !':'💡 Voici la réponse expliquée'}</strong><p>${q[3]}</p><button class="btn ${state.choice===q[2]?'green':'blue'}" onclick="nextQuestion()">${state.question===m.questions.length-1?'Terminer la mission':'Question suivante →'}</button></div>`:''}</div>`}function choose(i){if(state.answered)return;state.choice=i;state.answered=true;render()}function nextQuestion(){if(state.question===missions[state.mission].questions.length-1){if(!state.done.includes(state.mission)){state.done.push(state.mission);save()}show('collection')}else{state.question++;state.answered=false;state.choice=-1;render()}}

function atlas(){return `<div class="heading"><h2>🗺️ Atlas mondial interactif</h2></div><div class="panel"><p>Déplace la carte, zoome et sélectionne un repère pour découvrir un pays. Change de thème pour explorer les grands enjeux.</p><div class="map-controls">${layers.map((l,i)=>`<button class="${state.layer===i?'active':''}" onclick="setMapLayer(${i})">${l[0]}</button>`).join('')}</div><div id="worldmap"><div class="atlas-loading">🌍 Chargement de la carte…</div></div><div class="map-info" id="geoInfo"><strong>${layers[state.layer][0]}</strong><p>${layers[state.layer][1]}</p></div><p class="map-note">Fond cartographique © OpenStreetMap contributors · Carte nécessitant une connexion Internet. Les repères sont des capitales ou villes de référence, pas les contours des États. Les tracés thématiques sont schématiques.</p><button class="btn yellow" onclick="show('missions')">Partir en mission →</button></div>`}

function initAtlas(){if(state.view!=='atlas'||geoMap)return;const el=document.getElementById('worldmap');if(!el)return;if(!window.L){el.innerHTML='<div class="atlas-loading"><strong>Carte indisponible hors connexion</strong><p>Vérifie ta connexion Internet : les tuiles et la bibliothèque cartographique sont chargées en ligne.</p><a href="https://www.openstreetmap.org/#map=2/20/0" target="_blank" rel="noopener">Ouvrir OpenStreetMap</a></div>';return}el.innerHTML='';geoMap=L.map(el,{worldCopyJump:true,zoomControl:true,scrollWheelZoom:false,preferCanvas:true}).setView([18,8],2);L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:7,attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'}).addTo(geoMap);mapPoints.forEach(([name,lat,lon,detail])=>{let marker=L.marker([lat,lon]).addTo(geoMap);marker.bindPopup(`<strong>${name}</strong><br>${detail}<br><small>Appuie sur « Ouvrir la fiche » sous la carte</small>`);marker.on('click',()=>{const i=mapPoints.findIndex(p=>p[0]===name);document.getElementById('geoInfo').innerHTML=`<strong>${name}</strong><p>${detail}</p><button class="btn yellow" onclick="openCountry(${i})">📖 Ouvrir la fiche pays →</button>`})});drawMapLayer();requestAnimationFrame(()=>{if(geoMap)geoMap.invalidateSize(true)});setTimeout(()=>{if(geoMap)geoMap.invalidateSize(true)},350)}

function openCountry(i){selectedCountry=i;show('countries')}
function countries(){let i=selectedCountry,f=countryFacts[i],m=mapPoints[i];return `<div class="heading"><h2>🌍 Carnet des pays</h2><span class="muted">15 fiches à explorer</span></div><div class="country-picker" aria-label="Choisir un pays">${mapPoints.map((p,j)=>`<button class="${i===j?'active':''}" onclick="selectedCountry=${j};render()">${countryFacts[j][0]} ${p[0]}</button>`).join('')}</div><div class="country-hero"><div class="country-globe" aria-hidden="true">${f[0]}</div><div><span class="eyebrow">FICHE GÉOPOLITIQUE · ${i+1} / 15</span><h1>${m[0]}</h1><p>${f[4]}</p></div></div><div class="country-stats"><div><small>CAPITALE / REPÈRE</small><strong>${f[1]}</strong></div><div><small>RÉGION</small><strong>${f[2]}</strong></div><div><small>MONNAIE</small><strong>${f[3]}</strong></div></div><div class="panel"><h2>🧭 Pourquoi étudier ce pays ?</h2><p>${m[3]}. Cette fiche présente une piste de découverte pour comprendre les relations entre territoires, ressources, populations et échanges.</p><h3>🔎 Question d’enquête</h3><p>${f[5]}</p><div class="country-actions"><button class="btn yellow" onclick="show('atlas')">🗺️ Retour à l’atlas</button><button class="btn blue" onclick="show('missions')">🎯 Explorer les missions</button></div><p class="source-note">Fiches d’introduction sans statistiques actualisées. Les situations politiques et les données chiffrées demandent des sources datées.</p></div>`}
function collection(){return `<div class="heading"><h2>🃏 Mes cartes à collectionner</h2><span class="muted">${state.done.length} / ${missions.length} missions réussies</span></div><p>Termine les missions pour débloquer des cartes illustrées. Les illustrations sont des objets de collection, pas des documents cartographiques.</p><div class="collect">${cards.map(([name,img],i)=>`<article class="tile ${i<3&&!state.done.includes(i)?'locked':''}"><img src="${A+img}" alt="Carte ${name}"><div class="tile-body"><strong>${name}</strong><p>${i<3?(state.done.includes(i)?'⭐ Débloquée':'🔒 Mission '+(i+1)):'🔎 Carte de découverte'}</p></div></article>`).join('')}</div>`}function profile(){return `<div class="heading"><h2>🎒 Mon profil d'explorateur</h2></div><div class="panel"><div class="mission-head"><img src="${A}characters.webp" alt="Explorateurs"><div><span class="eyebrow">EXPLORATEUR DU MONDE</span><h2>Ton carnet d'aventure</h2><p>Les progrès sont enregistrés sur cet appareil, sans compte.</p></div></div><div class="statrow"><div class="stat"><strong>${xp()}</strong>Points XP</div><div class="stat"><strong>${state.done.length}/3</strong>Missions terminées</div><div class="stat"><strong>${state.done.length}</strong>Badges gagnés</div></div><div class="heading"><h2>🏅 Mes badges</h2></div><p>${state.done.length?'🌍 Explorateur · 🧭 Observateur · 📚 Enquêteur':'Réussis ta première mission pour obtenir ton premier badge.'}</p><button class="btn blue" onclick="show('missions')">Continuer l'exploration →</button></div>`}render();
</script></body></html>

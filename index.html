<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#092e4b"><title>GÉOPOLITIK — Explorer le monde</title><style>
:root{--navy:#0a2e4c;--blue:#14688b;--teal:#0e9c9c;--gold:#ffc64b;--cream:#fff8e9;--ink:#18384b}*{box-sizing:border-box}body{margin:0;background:#eaf4f3;color:var(--ink);font-family:system-ui,-apple-system,'Segoe UI',sans-serif}button{font:inherit;cursor:pointer}button:focus-visible{outline:3px solid #ef7b3b;outline-offset:3px}.hidden{display:none!important}.top{background:#082f4e;color:white;display:flex;align-items:center;justify-content:space-between;padding:12px clamp(12px,3vw,38px);gap:12px;border-bottom:4px solid #eab43b}.brand{font-size:clamp(1.25rem,3vw,2rem);font-weight:1000;letter-spacing:.04em;color:#ffcb50;text-shadow:1px 2px #915c12}.top small{color:#d3eef6}.top .right{display:flex;align-items:center;gap:10px}.xp{background:#164b69;padding:8px 13px;border-radius:20px;font-weight:750}.layout{max-width:1400px;margin:auto;display:grid;grid-template-columns:205px minmax(0,1fr);min-height:calc(100vh - 75px)}aside{background:#103c5a;padding:20px 12px;color:white}aside .nav{width:100%;display:flex;gap:10px;align-items:center;padding:14px 12px;border:0;background:transparent;color:#d9eff6;border-radius:15px;text-align:left;font-weight:800;margin-bottom:6px}aside .nav.active{background:linear-gradient(#ffe28c,#ffb833);color:#17354a;box-shadow:0 4px #a9731b}aside .nav span{font-size:1.5rem}.aside-foot{font-size:.79rem;color:#b5d6e4;line-height:1.5;margin:30px 9px}.main{padding:clamp(12px,2.5vw,28px);min-width:0}.eyebrow{display:inline-block;background:#ffde82;border-radius:100px;padding:6px 12px;font-size:.76rem;font-weight:900;color:#77500b;letter-spacing:.06em}.hero{position:relative;border-radius:28px;min-height:380px;background:linear-gradient(105deg,#083553d9,#0b5c79a8),url('assets/hero.webp') center/cover;box-shadow:0 12px 25px #06344a25;overflow:hidden;border:5px solid white;color:white;display:flex;align-items:center}.hero-copy{position:relative;z-index:1;padding:clamp(22px,4vw,50px);max-width:580px}.hero h1{font-size:clamp(2.5rem,5.8vw,5.3rem);line-height:1;margin:14px 0 4px;color:#ffd15a;text-shadow:3px 5px #08283c,-1px -1px #ffe3a3;letter-spacing:.025em}.hero p{font-size:1.1rem;line-height:1.5;text-shadow:0 2px 6px #092c3e}.hero-people{position:absolute;right:-3%;bottom:-10px;width:51%;height:90%;object-fit:contain;object-position:bottom;filter:drop-shadow(0 9px 10px #04273b77)}.btn{border:0;border-radius:15px;padding:12px 19px;font-weight:900;box-shadow:0 4px #a97b24;transition:transform .15s}.btn:hover{transform:translateY(-2px)}.yellow{background:linear-gradient(#ffe995,#ffb72e);color:#183b50}.green{background:linear-gradient(#62d789,#19a956);color:white;box-shadow:0 4px #10783a}.blue{background:linear-gradient(#32a8d4,#0c6caa);color:white;box-shadow:0 4px #084d80}.heading{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:24px 0 13px}.heading h2{margin:0;color:#103b5a;font-size:clamp(1.4rem,2.4vw,2rem)}.muted{color:#5d7480;font-size:.91rem}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:17px}.tile{background:#fffaf0;border:4px solid white;border-radius:20px;overflow:hidden;box-shadow:0 7px 18px #123b531b}.tile img{width:100%;height:170px;object-fit:cover;display:block}.tile-body{padding:16px}.tile h3{margin:0 0 7px;color:#133b54}.tile p{margin:0 0 15px;line-height:1.45;color:#466474;font-size:.9rem}.tile button{border:0;border-radius:12px;padding:10px 14px;background:#0d8590;color:white;font-weight:800}.panel{background:#fffaf0;border:4px solid white;border-radius:24px;padding:clamp(16px,2vw,28px);box-shadow:0 8px 20px #123b5319}.pills{display:flex;flex-wrap:wrap;gap:8px;margin:15px 0}.pills button{border:1px solid #b6d3d9;background:white;border-radius:100px;padding:10px 15px;color:#20506a;font-weight:800}.pills button.active{background:#0e7b9b;color:white;border-color:#0e7b9b}.atlas-area{background:linear-gradient(145deg,#c6ebef,#e5f5e8);border-radius:20px;overflow:hidden;position:relative;min-height:370px;display:grid;place-items:center}.atlas-area svg{width:100%;max-height:490px;display:block}.atlas-area img{width:100%;max-height:480px;object-fit:contain}.map-status{padding:10px 15px;background:#e6f5f4;border-radius:12px;line-height:1.5}.mission-head{display:grid;grid-template-columns:240px 1fr;gap:22px;align-items:center}.mission-head img{width:100%;border-radius:16px}.progress{height:12px;background:#d7e8e7;border-radius:20px;overflow:hidden}.progress>span{display:block;height:100%;background:linear-gradient(90deg,#25b68d,#ffc344);transition:width .2s}.choices{display:grid;gap:10px;margin:18px 0}.choices button{text-align:left;border:2px solid #d2e4e6;background:white;border-radius:15px;padding:14px;font-weight:650}.choices button.correct{border-color:#2ca66d;background:#ddf8e7}.choices button.wrong{border-color:#d75d5d;background:#fff0e9}.feedback{background:#e5f4fa;padding:16px;border-radius:16px;line-height:1.5}.collect{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px}.collect .tile{padding:10px;text-align:center}.collect img{height:220px;object-fit:contain}.locked img{filter:grayscale(1);opacity:.35}.statrow{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.stat{background:#e4f4f2;padding:20px;border-radius:15px;text-align:center}.stat strong{font-size:2rem;color:#087c93;display:block}.level-card{padding:15px;border-radius:14px;background:#eaf5f4;line-height:1.65}.source-note{font-size:.78rem;color:#657a84;margin-top:12px}footer{text-align:center;padding:25px;color:#627b86;font-size:.8rem}@media(max-width:850px){.layout{grid-template-columns:1fr}aside{position:sticky;top:0;z-index:5;display:flex;overflow-x:auto;gap:6px;padding:8px;background:#103c5a}aside .nav{min-width:max-content;margin:0;padding:10px 13px}aside .nav span{font-size:1.15rem}.aside-foot{display:none}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.hero-people{opacity:.72;width:65%}}@media(max-width:540px){.top small{display:none}.main{padding:10px}.hero{min-height:370px}.hero-copy{padding:22px;align-self:end;background:linear-gradient(transparent,#072e4dd9)}.hero-people{width:100%;height:67%;right:-19%;top:0;opacity:.9}.hero h1{font-size:2.7rem}.hero p{font-size:.93rem}.grid{gap:10px}.tile img{height:112px}.tile-body{padding:11px}.tile h3{font-size:.98rem}.tile p{font-size:.8rem}.mission-head{grid-template-columns:1fr}.mission-head img{max-height:180px;object-fit:cover}.collect{grid-template-columns:repeat(2,minmax(0,1fr))}.statrow{grid-template-columns:1fr}.heading{align-items:start}}
</style></head><body><header class="top"><div><div class="brand">🌍 GÉOPOLITIK</div><small>Comprendre le monde en jouant</small></div><div class="right"><span class="xp" id="xpTop">⭐ 0 XP</span><button class="btn yellow" onclick="show('profile')">Mon profil</button></div></header><div class="layout"><aside id="nav"></aside><main class="main"><div id="content"></div><footer>GÉOPOLITIK · Prototype V3 · Les cartes explicatives sont datées et les illustrations ne remplacent pas une carte géographique vérifiée.</footer></main></div><script>
const A='assets/';const worlds=[{name:'Le monde et ses puissances',img:'powers.webp',icon:'🌐',desc:'Les États, les organisations et les rapports de puissance.',detail:['Les pays ont des intérêts différents. Ils coopèrent dans des organisations internationales et peuvent aussi être en désaccord.','La puissance repose notamment sur l’économie, la diplomatie, la technologie, la culture et les capacités militaires. L’ONU facilite le dialogue entre les États.','Une puissance se construit dans des relations et des contextes changeants. Les organisations multilatérales offrent des espaces de négociation sans supprimer les asymétries entre États.']},{name:'Les échanges mondiaux',img:'trade.webp',icon:'🚢',desc:'Routes maritimes, commerce et interdépendances.',detail:['Beaucoup d’objets que nous utilisons ont voyagé par bateau.','Les chaînes d’approvisionnement relient les lieux de production et de consommation. Certains détroits et canaux sont des passages stratégiques.','La mondialisation repose sur des réseaux logistiques vulnérables aux perturbations, notamment dans les goulets d’étranglement maritimes.']},{name:'Les ressources stratégiques',img:'resources.webp',icon:'⚡',desc:'Énergie, eau, minerais et agriculture.',detail:['Les ressources utiles à nos vies ne sont pas réparties partout de la même façon.','L’accès à l’eau, à l’énergie et aux minerais influence les économies et les relations entre États.','La criticité d’une ressource dépend de sa disponibilité, de la demande, des possibilités de substitution et des concentrations de production.']},{name:'Les tensions et les conflits',img:'conflicts.webp',icon:'🕊️',desc:'Comprendre les causes, les acteurs et les conséquences.',detail:['Un conflit peut avoir plusieurs causes. Les populations civiles en subissent souvent les conséquences.','Les différends territoriaux, les enjeux de sécurité, les intérêts politiques et les héritages historiques peuvent contribuer aux tensions.','L’analyse géopolitique distingue les acteurs, leurs intérêts, le droit international, les récits concurrents et les conséquences humaines.']},{name:'Les nouveaux enjeux',img:'future.webp',icon:'🛰️',desc:'Espace, numérique, climat et technologies.',detail:['Le climat, Internet et l’espace concernent de nombreux pays.','Les satellites, les réseaux numériques et les transitions énergétiques créent de nouvelles coopérations et rivalités.','La maîtrise des infrastructures critiques et des normes technologiques est devenue un levier majeur de puissance.']},{name:'Les régions du monde',img:'regions.webp',icon:'🗺️',desc:'Explorer les territoires et leurs particularités.',detail:['Chaque région du monde possède une histoire et des paysages variés.','Les régions sont des constructions géographiques qui facilitent la comparaison, sans effacer la diversité des territoires.','Les découpages régionaux varient selon les critères physiques, historiques, politiques, économiques et culturels.']}];
const missions=[{title:'Qui dirige le monde ?',img:'powers.webp',intro:'Enquête sur les puissances et les organisations internationales.',questions:[['Quel organisme rassemble presque tous les États du monde ?',['L’ONU','La NASA','Le CIO'],0,'L’ONU est une organisation internationale réunissant presque tous les États du monde.'],['Quelle affirmation est juste ?',['Un seul pays dirige tous les autres','La puissance peut prendre plusieurs formes','Seule la taille d’un pays compte'],1,'La puissance est économique, politique, culturelle, technologique et parfois militaire.'],['Quel exemple relève de la diplomatie ?',['Négocier un accord entre États','Mesurer une montagne','Construire un stade'],0,'La diplomatie organise le dialogue et les négociations entre acteurs internationaux.']]},{title:'Pourquoi les mers sont-elles importantes ?',img:'trade.webp',intro:'Pars sur les grandes routes du commerce mondial.',questions:[['Quel canal relie la Méditerranée à la mer Rouge ?',['Le canal de Suez','Le canal du Midi','Le canal de Panama'],0,'Le canal de Suez relie la Méditerranée à la mer Rouge.'],['Pourquoi certains détroits sont-ils stratégiques ?',['Ils concentrent des passages maritimes','Ils sont tous inhabités','Ils interdisent tout commerce'],0,'Ces passages peuvent concentrer d’importants flux de marchandises.'],['Qu’est-ce qu’une interdépendance ?',['Des pays sans aucun échange','Des acteurs qui dépendent les uns des autres','Une frontière naturelle'],1,'Les échanges créent des liens et des dépendances entre territoires.']]},{title:'À qui appartient l’Arctique ?',img:'regions.webp',intro:'Explore les espaces polaires et leurs enjeux.',questions:[['Quelle proposition est correcte ?',['Un seul État possède tout l’Arctique','Plusieurs États ont des territoires et des droits maritimes','Aucune règle internationale ne s’applique'],1,'Les espaces terrestres et maritimes sont soumis à des statuts juridiques différents.'],['Que modifie le recul de la banquise ?',['Les conditions de navigation','La position du pôle Nord','Le nombre de continents'],0,'Le recul de la banquise peut faciliter certaines navigations saisonnières, avec des risques persistants.'],['Quel enjeu doit aussi être pris en compte ?',['Les droits des peuples autochtones','Uniquement le tourisme','La disparition des lois'],0,'Les peuples autochtones et les écosystèmes doivent être pris en compte dans les décisions.']]}];
const cards=[['France','france.webp'],['Canal de Suez','suez.webp'],['Amazonie','amazon.webp'],['Énergies renouvelables','renewable.webp'],['Arctique','arctic.webp'],['Grandes puissances','powercard.webp'],['Espace','space.webp'],['Routes maritimes','routes.webp']];let state={view:'home',level:0,mission:0,question:0,answered:false,choice:-1,layer:0,done:[]};try{state.done=JSON.parse(localStorage.getItem('geopolitik-v3-done')||'[]')}catch(e){}const navs=[['home','🌍','Accueil'],['atlas','🗺️','Atlas mondial'],['countries','🏯','Fiches pays'],['dossiers','📚','Dossiers'],['missions','🧭','Missions'],['quiz','🏆','Quiz'],['collection','🃏','Collection'],['profile','🎒','Profil']];function save(){try{localStorage.setItem('geopolitik-v3-done',JSON.stringify(state.done))}catch(e){}}function show(v){state.view=v;render();window.scrollTo({top:0,behavior:'smooth'})}function renderNav(){document.getElementById('nav').innerHTML=navs.map(([id,ic,name])=>`<button class="nav ${state.view===id?'active':''}" onclick="show('${id}')"><span>${ic}</span>${name}</button>`).join('')+'<div class="aside-foot">Explore • Comprends • Enquête • Retient<br>Trois niveaux pédagogiques</div>'}function xp(){return state.done.length*120}function render(){renderNav();document.getElementById('xpTop').textContent='⭐ '+xp()+' XP';let c=document.getElementById('content');c.innerHTML=({home,atlas,countries,dossiers,missions:missionList,quiz:quizView,collection,profile})[state.view]();}function home(){return `<div class="hero"><div class="hero-copy"><span class="eyebrow">✦ TON AVENTURE COMMENCE ICI</span><h1>GÉOPOLITIK</h1><p>Explore les pays, découvre les enjeux du monde et débloque tes cartes de géopolitique !</p><button class="btn yellow" onclick="show('atlas')">🧭 EXPLORER LE MONDE</button></div><img class="hero-people" src="${A}characters.webp" alt="Jeunes explorateurs"></div><div class="heading"><h2>🌎 Les six univers à explorer</h2><span class="muted">Choisis ton aventure</span></div><div class="grid">${worlds.map((w,i)=>tile(w.img,w.name,w.desc,`openWorld(${i})`,'Découvrir →')).join('')}</div><div class="heading"><h2>⭐ Missions du moment</h2></div><div class="grid">${missions.map((m,i)=>tile(m.img,m.title,m.intro,`start(${i})`,'Commencer →')).join('')}</div>`}function tile(img,title,desc,action,label){return `<article class="tile"><img src="${A+img}" alt=""><div class="tile-body"><h3>${title}</h3><p>${desc}</p><button onclick="${action}">${label}</button></div></article>`}function openWorld(i){state.world=i;show('dossiers')}
const levels=['Je découvre · Collège','Je comprends · Lycée','Je décrypte · Approfondissement'];function levelButtons(){return `<div class="pills">${levels.map((s,i)=>`<button class="${state.level===i?'active':''}" onclick="state.level=${i};render()">${s}</button>`).join('')}</div>`}function dossiers(){let idx=state.world??0;return `<div class="heading"><h2>📚 Dossiers thématiques</h2></div>${levelButtons()}<div class="grid">${worlds.map((w,i)=>`<article class="tile"><img src="${A+w.img}" alt=""><div class="tile-body"><h3>${w.icon} ${w.name}</h3><p>${w.detail[state.level]}</p><button onclick="state.world=${i};show('atlas')">Voir l'atlas →</button></div></article>`).join('')}</div><p class="source-note">Contenus de démonstration : à enrichir de sources datées pour une publication pédagogique complète.</p>`}function missionList(){return `<div class="heading"><h2>🧭 Missions d'exploration</h2></div><p>Trois enquêtes, chacune composée de trois défis et d'une explication après chaque réponse.</p><div class="grid">${missions.map((m,i)=>tile(m.img,(state.done.includes(i)?'✅ ':'')+m.title,m.intro,`start(${i})`,'Jouer →')).join('')}</div>`}function start(i){state.mission=i;state.question=0;state.answered=false;state.choice=-1;show('quiz')}function quizView(){let m=missions[state.mission],q=m.questions[state.question],n=state.question+1;return `<div class="heading"><h2>🏆 Mission ${state.mission+1} : ${m.title}</h2></div><div class="panel"><div class="mission-head"><img src="${A+m.img}" alt=""><div><span class="eyebrow">DÉFI ${n} / ${m.questions.length}</span><h2>${m.title}</h2><p>${m.intro}</p><div class="progress"><span style="width:${(n-1)/m.questions.length*100}%"></span></div></div></div><h2 style="margin-top:25px">${q[0]}</h2><div class="choices">${q[1].map((v,i)=>`<button ${state.answered?'disabled':''} class="${state.answered?(i===q[2]?'correct':i===state.choice?'wrong':''):''}" onclick="choose(${i})">${'ABCD'[i]}. ${v}</button>`).join('')}</div>${state.answered?`<div class="feedback"><strong>${state.choice===q[2]?'✅ Bien joué !':'💡 Voici la réponse expliquée'}</strong><p>${q[3]}</p><button class="btn ${state.choice===q[2]?'green':'blue'}" onclick="nextQuestion()">${state.question===m.questions.length-1?'Terminer la mission':'Question suivante →'}</button></div>`:''}</div>`}function choose(i){if(state.answered)return;state.choice=i;state.answered=true;render()}function nextQuestion(){if(state.question===missions[state.mission].questions.length-1){if(!state.done.includes(state.mission)){state.done.push(state.mission);save()}show('collection')}else{state.question++;state.answered=false;state.choice=-1;render()}}
const layers=[['Pays et frontières','Les frontières politiques délimitent les territoires des États. Certaines frontières et certains territoires sont contestés.'],['Routes maritimes','Les routes maritimes relient les ports et les régions productrices et consommatrices.'],['Ressources','La répartition des ressources naturelles influence les échanges et les politiques publiques.'],['Climat','Les changements climatiques ont des effets différents selon les régions du monde.'],['Organisations','Les organisations internationales et régionales facilitent la coopération entre États.']];function atlas(){return `<div class="heading"><h2>🗺️ Atlas mondial</h2></div><div class="panel"><p>Explore les grandes thématiques. La carte ci-dessous est une illustration d'orientation ; elle ne constitue pas encore une carte géographique interactive vérifiée.</p><div class="pills">${layers.map((l,i)=>`<button class="${state.layer===i?'active':''}" onclick="state.layer=${i};render()">${l[0]}</button>`).join('')}</div><div class="atlas-area"><img src="${A}routes.webp" alt="Illustration de routes commerciales sur un globe stylisé"></div><div class="map-status"><strong>${layers[state.layer][0]}</strong><p>${layers[state.layer][1]}</p></div><button class="btn yellow" onclick="show('missions')">Partir en mission →</button></div>`}function countries(){return `<div class="heading"><h2>🏯 Fiches pays</h2></div><div class="panel"><div class="mission-head"><img src="${A}france.webp" alt="Illustration de la France"><div><span class="eyebrow">FICHE DÉCOUVERTE</span><h2>🇫🇷 France</h2><p><strong>Capitale :</strong> Paris<br><strong>Continent :</strong> Europe<br><strong>Monnaie :</strong> euro<br><strong>Organisation :</strong> membre de l'Union européenne et de l'ONU</p></div></div><h3>Pourquoi ce pays compte-t-il ?</h3><p>La France joue un rôle diplomatique, économique et culturel à l'échelle européenne et mondiale. Elle dispose de territoires ultramarins et participe à de nombreuses organisations internationales.</p><p class="source-note">Fiche de démonstration : les données chiffrées et les cartes de frontières devront être sourcées et datées.</p></div>`}function collection(){return `<div class="heading"><h2>🃏 Mes cartes à collectionner</h2><span class="muted">${state.done.length} / ${missions.length} missions réussies</span></div><p>Termine les missions pour débloquer des cartes illustrées. Les illustrations sont des objets de collection, pas des documents cartographiques.</p><div class="collect">${cards.map(([name,img],i)=>`<article class="tile ${i<3&&!state.done.includes(i)?'locked':''}"><img src="${A+img}" alt="Carte ${name}"><div class="tile-body"><strong>${name}</strong><p>${i<3?(state.done.includes(i)?'⭐ Débloquée':'🔒 Mission '+(i+1)):'🔎 Carte de découverte'}</p></div></article>`).join('')}</div>`}function profile(){return `<div class="heading"><h2>🎒 Mon profil d'explorateur</h2></div><div class="panel"><div class="mission-head"><img src="${A}characters.webp" alt="Explorateurs"><div><span class="eyebrow">EXPLORATEUR DU MONDE</span><h2>Ton carnet d'aventure</h2><p>Les progrès sont enregistrés sur cet appareil, sans compte.</p></div></div><div class="statrow"><div class="stat"><strong>${xp()}</strong>Points XP</div><div class="stat"><strong>${state.done.length}/3</strong>Missions terminées</div><div class="stat"><strong>${state.done.length}</strong>Badges gagnés</div></div><div class="heading"><h2>🏅 Mes badges</h2></div><p>${state.done.length?'🌍 Explorateur · 🧭 Observateur · 📚 Enquêteur':'Réussis ta première mission pour obtenir ton premier badge.'}</p><button class="btn blue" onclick="show('missions')">Continuer l'exploration →</button></div>`}render();
</script></body></html>
